_target_: src.inference.iterative.IterativeGuide
_partial_: true
guide:
  _target_: src.inference.auto_mean_field.AutoMeanFieldProposal
  _partial_: true
solver:
  _target_: optimistix.NonlinearCG
  rtol: 1e-3
  atol: 1e-3
max_steps: 50
tracer:
  _target_: src.inference.tracer.ParticleTracer
  # beta scales the latent (KL) terms of the inner objective; 0 adapts the
  # guide on reconstruction alone, which stays bounded where the relaxed
  # densities' KL does not.
  beta: 0.05
  num_particles: 4
