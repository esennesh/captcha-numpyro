defaults:
  - placements/shaper/shape_dict: recaptcha

_target_: src.model.model.generate_captcha
_partial_: true
backgrounder: null
placements:
  _target_: src.model.model.ShapePlacements
  prior:
    _target_: src.model.model.TopographicPoisson
    kh: 60
    kw: 60
    img_h: 100
    img_w: 200
    num_features: 244
    rngs:
      _target_: flax.nnx.Rngs
      default: 1234
  rngs:
    _target_: flax.nnx.Rngs
    default: 9101112
  shaper:
    _target_: src.model.model.ShapeConvTranspose
    padding: "VALID"
    rngs:
      _target_: flax.nnx.Rngs
      default: 5678
    strides: 1
    transpose_kernel: true
