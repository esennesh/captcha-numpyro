defaults:
  - placements/shaper/shape_dict@placements.shape_dict: sandbox

_target_: src.model.model.marionette_captcha_model
_partial_: true
backgrounder: null
placements:
  _target_: src.model.model.PoissonMarkedPlacements
  count_concentration: 2.0
  expected_count: 2.0
  img_h: 80
  img_w: 80
  kh: 38
  kw: 26
  # Sparse within-patch glyph competition: each anchor's mark simplex should
  # commit to a single glyph. Sparsity is set by the TOTAL concentration
  # alpha0 = K * mark_concentration, not by the per-glyph value: with K = 36
  # glyphs, the old 0.5 gave alpha0 = 18 and spread every anchor's mark over
  # ~18 glyphs at once. 0.25 / 36 keeps alpha0 below 1 -- ~1.5 effective
  # glyphs per anchor, mean top weight 0.87.
  mark_concentration: 0.007
  rngs:
    _target_: flax.nnx.Rngs
    default: 5678
  stride: 1
  # Sparse allocation: the firing mass should land on as many anchors as we
  # expect glyphs. As above, what matters is alpha0 = H * W *
  # where_concentration, and the anchor grid here is large: H = (80 - 38) + 1
  # = 43 by W = (80 - 26) + 1 = 55, so 2365 anchors. The old 0.1 gave alpha0 =
  # 236 -- a nearly uniform allocation over ~360 anchors, none of which ever
  # accumulated enough intensity to render a glyph. 0.5 / 2365 gives ~2
  # effective anchors, matching expected_count.
  #
  # NOTE: this value is grid-dependent. Changing img_h/img_w/kh/kw/stride
  # changes H * W and so silently rescales alpha0; recompute it from the rule
  # above rather than carrying this number over.
  where_concentration: 0.0002
