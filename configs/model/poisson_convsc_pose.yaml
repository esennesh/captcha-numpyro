# `poisson_convsc_gmrf` with a discrete per-occurrence pose, and the warp
# conditioned back to affine-free.
#
# WHY THE PAIR. `affine_free_velocity` was originally justified on the grounds
# that translation, rotation, scale and shear are "redundant with glyph
# placement and pose latents". Section 26 found that premise false for this
# renderer, because there was no pose latent: conditioning the affine modes out
# simply deleted rotation from the model, and one glyph-sized 25 degree rotation
# went from 99 nats to 2,294. This config supplies the missing latent, which
# makes the premise true, so the two changes belong together and neither is
# worth running alone.
#
# Ladder A2 is why we want the warp constrained again. On the five upright
# images A1 solves 10/10 with the warp off, enabling it dropped identity to
# 4/10 while the log joint barely moved -- positions stayed right and labels
# went wrong, X@(44,58) for a true N@(45,56), I@(44,53) for a true V@(46,53) --
# because 200 continuous velocity coordinates can deform a wrong glyph into the
# right shape. A categorical over 13 angles can turn a glyph and cannot turn an
# X into an N.
#
# HOW. Pose is one continuous angle per spatial slot, shared by whatever glyphs
# are centred there. That is affordable because a rotation is linear in the
# patch and so commutes with the sum over dictionary entries: contract the
# counts against the dictionary first and an 80 x 80 render needs one rotation
# per slot -- 2,365 -- rather than one per (slot, glyph).
#
# It replaces an earlier pre-rotated dictionary of K x A entries, on every axis:
#
#                            per-slot angle   (glyph, angle) pair
#   latents                        87,505               1,106,820
#   render, one laptop core           5 ms                  240 ms
#   pose                        continuous                13 atoms
#   needs a relaxation                  no                     yes
#
# The last row matters most. A Circular support is one `biject_to` handles, so
# AutoMAPProposal treats pose as an ordinary continuous site with a transformed
# Normal proposal: no DSGD relaxation, no finite-discrete site, and none of
# section 27's two-hour exact-update problem.

defaults:
  - poisson_convsc_gmrf
  - _self_

placements:
  _target_: src.model.model.SlotPosePlacements

  # sigma = 10 degrees matches the 9.81 degree standard deviation measured over
  # the twenty glyphs in data/examples. It charges 0.50 nats at 10 degrees, 4.39
  # at 30 and 65.6 at 180, so a flip is expensive without being forbidden. The
  # prior is weak against a glyph signal of order 800 nats and will not by
  # itself prevent a spurious rotation -- pose has to be disciplined by the
  # likelihood and by how few slots are occupied. See section 27.
  pose_sigma_degrees: 10.0

  # Back to affine-free, which is the whole point of the pair above.
  warp_modes: affine

  # C3 off. Ladder S2 measured it: on the five rotated images the constraint
  # excluded three of the twenty true glyph slots, and lifting it takes identity
  # from 3/10 to 6/10 with the three recoveries being exactly those slots --
  # A@(39,76), Z@(40,74), S@(44,75) -- for +1,294 nats of glyph evidence in
  # total. Half-visible rim stamps return, so A3's fragments were not a warp
  # artifact, but they now coexist with correct glyphs rather than replacing
  # them and they cover real ink. `0000_LJ`, whose two glyphs were both inside
  # the bound, is the only image that loses (-535 nats). See section 26.
  require_on_canvas: false

  # 5.0 -> 1.5, the value that predated section 26. The amplitude was raised to
  # 5.0 only so the warp could afford rotations the model had no other way to
  # express; with pose explicit the warp is left to supply genuinely non-rigid
  # residual and does not need the reach. Worth trying at 5.0 as a one-flag
  # variation -- --set placements.warp_scale=5.0 -- to see whether the extra
  # freedom starts assembling committees again even with the affine modes
  # conditioned out.
  warp_scale: 1.5
