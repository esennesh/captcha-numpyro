# @package _global_

defaults:
  - override /data: captcha
  # Amortized convolutional proposal over the integer activation field. Its
  # rate head is initialized from the matched filter Phi^T x (the adjoint of the
  # generative stamp), which is what makes the search over 230,400 sites
  # tractable at all -- see section 12. Swap to auto_mean_field for a
  # non-amortized mirror.
  - override /guide: poisson_convsc_encoder
  - override /learner: graphical
  - override /learner/optim: clipped_adamw
  - override /model: poisson_convsc

data:
  height: 80
  width: 80

learner:
  tracer:
    # Double control variate (Titsias & Shi 2022): REINFORCE on the remainder of
    # a first-order expansion of the ELBO about E_q[z], plus the exact
    # g . grad_phi E_q[z] term -- a pathwise-flavoured gradient obtained without
    # reparameterizing. ELBOTracer's plain score-function estimator never gets
    # traction on the 230,400-site Poisson field: measured over 1000 steps it
    # drifts AWAY from the ELBO optimum and its reconstruction degrades.
    #
    # ==> DSGD is better, and is the quality option. <==
    #
    # Measured on the current objective (blend + StudentT nu(tau)), approaching
    # the optimum log_total_q = 1.00 from an initialisation at 1.50:
    #
    #                 log_total_q    E[MSE]   s/step
    #   RLOO               1.5507   0.00555     0.39   (moves the wrong way)
    #   DoubleCV           1.2456   0.00392     0.40
    #   DSGD               1.0986   0.00299     0.69
    #   blank canvas                0.01338
    #
    # DSGD is closest to the optimum and reconstructs 24% better, at 1.7x the
    # cost per step. It is not selectable here because it is a program
    # transformation rather than a tracer: wrap BOTH model and guide in
    # numpyro.contrib.diag_sgd.dsgd(...) and drive the eta schedule across
    # training (eta_schedule(K, ell=count_layers(model, x), eta_final=0.05)).
    # No tracer change is needed -- SmoothedCount.has_rsample is True, so
    # ELBOTracer reclassifies the `a` site as reparameterized on its own.
    #
    # Note when implementing: DSGD accepts a TRACED eta (diag_sgd.py:1054), so
    # no per-step recompilation is required. The scratch probes recompiled only
    # because GraphicalModelLearner._update is a cached_property whose jitted
    # closure captures self.model/self.guide, making a partial-applied eta a
    # compile-time constant. Thread eta through as an argument to that jitted
    # function instead. See section 22 of notes/poisson-convsc-design.md.
    _target_: src.inference.tracer.DoubleCVTracer
    num_particles: 4

model:
  backgrounder: null

trainer:
  epochs: 50
  save_period: 10
