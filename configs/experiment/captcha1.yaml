# @package _global_

defaults:
  - override /data: captcha1
  - override /guide: auto_mean_field
  - override /learner: batchvi
  - override /model: captcha

data:
  drop_last: true
  indexed: true

learner:
  optim:
    learning_rate: 1e-4

model:
  backgrounder: null
  placements:
    prior:
      _target_: src.model.model.TopographicPoisson
      img_h: 80
      img_w: 80
      num_features: 108

trainer:
  epochs: 100
  save_period: 100
