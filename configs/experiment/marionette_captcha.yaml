# @package _global_

defaults:
  - override /data: captcha
  - override /guide: marionette_captcha_encoder
  - override /learner: graphical
  - override /model: marionette_captcha

data:
  height: 80
  width: 80

guide:
  backgrounder: null
  placements:
    shape_dict: ${model.placements.shape_dict}

learner:
  optim:
    learning_rate: 1e-4
  tracer:
    _target_: src.inference.tracer.ELBOTracer
    num_particles: 16

model:
  backgrounder: null

trainer:
  epochs: 1000
  save_period: 250
