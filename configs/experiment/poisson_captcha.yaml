# @package _global_

defaults:
  - override /data: captcha
  # Placeholder guide until the model's next inference method lands: the
  # mean-field mirror composes and traces, but per-batch adaptation is gone
  # with the iterative guides.
  - override /guide: auto_mean_field
  - override /learner: graphical
  - override /learner/optim: clipped_adamw
  - override /model: poisson_captcha

data:
  height: 80
  width: 80

learner:
  tracer:
    _target_: src.inference.tracer.ELBOTracer
    num_particles: 4

model:
  backgrounder: null

trainer:
  epochs: 50
  save_period: 50
