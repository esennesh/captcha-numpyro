# `map_proposal`, but with the relaxed count field held in linear space under a
# nonnegativity projection rather than reparameterized through a logarithm.
#
# WHY: `AutoMAPProposal` reparameterizes every site through
# `biject_to(support)`, and a DSGD-relaxed count site has support (0, inf), so
# the MAP phase walks log a. Adam moves each coordinate by about one step size
# per step, so from the prior rate 4/230400 a stamp needs 10.96/step_size steps
# before it renders anything: 219 at 0.05. The paper logit reaches its correct
# value in about 34, and the ink colour and texture sooner. Whichever block
# explains the ink first keeps it, and in log space the counts are guaranteed to
# arrive last. The first pod run showed exactly that -- the paper field drew
# both glyphs and the count field was left stamping the confetti.
#
# Sections 3 and 4 of notebooks/partitioned_gmrf do not have this problem: they
# hold the counts as a plain nonnegative parameter, start at zero, and step at
# 1e-3 in linear space, so a coefficient is useful after about 40 steps.
#
# Measured on a 20x20 canvas at the pod's own count rate, all non-count sites
# stepping at 0.05 so only the count geometry differs:
#
#                             50 steps            600 steps
#   parameterization    max count   loss     max count  loss   active  exact 0
#   log,    step 0.05     0.0003  -1698.1      0.2038  -2035.3      9        0
#   linear, step 1e-3     0.0369  -1800.6      0.0830  -2033.2      6      393
#   linear, step 1e-2     0.1605  -1802.6      0.2881  -2036.3      2      398
#
# So the geometry buys speed early -- two to three orders of magnitude of count
# amplitude at 50 steps -- and lands on the same objective by 600. It also buys
# genuine sparsity for free: projected gradient descent against the Poisson
# prior pins unsupported sites at exactly zero, which the logarithm can never
# reach, so there is no need for the notebook's threshold-and-refine pass.
#
# UNVERIFIED at 80x80. The toy above has no glyph-shaped structure for the paper
# field to steal, so it cannot show whether this fixes the role inversion.

defaults:
  - map_proposal
  - _self_

guide_class:
  _target_: src.inference.linear_count_proposal.LinearCountMAPProposal
  _partial_: true

# The count block gets its own step size and the projection; everything else
# keeps a step suited to a logit or a velocity. `keep_params_nonnegative` needs
# `params` passed to `update`, which `numpyro.optim.optax_to_numpyro` does.
#
# count_step_size must be small relative to the amplitude the ANSWER lives at,
# not relative to one. A recovered glyph holds a peak amplitude of 0.06 to 0.11
# over a few hundred coefficients, so 1e-2 is 10-20% of the target in a single
# Adam step: too coarse to resolve a sparse solution, and the field random-walks
# up to a diffuse haze instead. Ladder A1 on the five upright examples, giving
# glyph evidence / count total / coefficients:
#
#   image       at 1e-2                       at 1e-3
#   0000_N6     +1,522    0.88      807       +1,655   0.60    497
#   0001_OO     +2,338    0.98      466       +2,482   0.79    629
#   0002_J8       -170    6.18    6,253       +2,125   1.18  1,084
#   0003_LN    -15,398 1605.37   31,291       +2,278   0.85    559
#   0004_V6       +545    2.37      848       +2,028   0.94    799
#
# 1e-3 recovers both glyphs on all five; 1e-2 manages three and diverges on one.
# It is also the value sections 3 and 4 of notebooks/partitioned_gmrf.ipynb use,
# and the default of `count_block_adam` -- an earlier version of this config had
# overridden it to 1e-2 on the strength of a 20x20 toy whose amplitude scale was
# different, which cost a pod run to find.
map_optimizer:
  _target_: src.inference.linear_count_proposal.count_block_adam
  count_step_size: 1.0e-3
  step_size: 5.0e-2
  count_sites: [a]
  # `pose`, where the model has one, needs its own scale. numpyro warns that
  # "continuous inference poorly handles circular sample site 'pose'", and it is
  # right about the reason: biject_to(circular) is Sigmoid composed with an
  # affine map onto (-pi, pi), so its derivative at zero is pi/2 and ONE UNIT OF
  # THE UNCONSTRAINED PARAMETER IS 90 DEGREES. At the shared 5e-2 a step would
  # move pose 4.5 degrees, almost half its own prior's width.
  #
  # The distortion itself is mild over the range this model uses -- the
  # derivative at 25 degrees is 0.978 of its value at zero, a 2% change -- so
  # only the scale needs fixing, not the parameterization. pose_step_size(1.8)
  # gives 1.8 degrees per step: a fifth of the prior's width, finer than the
  # 5-degree grid the matched filter resolves, and 14 steps from upright to 25.
  #
  # numpyro's suggested CircularReparam would make the geometry exactly linear
  # and remove the cut at +-pi, but it costs two things measured on 2026-09-08:
  # the model becomes UNTRACEABLE, because ImproperUniform has no `.sample`, so
  # prior-predictive draws and `experiments.py prior-recovery` stop working; and
  # `init_to_sample` silently degrades to init_to_uniform on the unwrapped site,
  # which starts pose uniform over +-115 degrees instead of near zero. Not worth
  # it while the posterior sits inside +-30 degrees and the cut at +-180 already
  # costs 65.6 nats of von Mises prior.
  # 0.02 unconstrained = radians(1.8) / (pi/2). A plain number rather than a
  # `_target_` call, so this config never depends on a helper being present.
  step_sizes:
    pose: 0.02
