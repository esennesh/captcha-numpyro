_target_: src.inference.map_proposal_online.MAPProposalCaptchaInference
_partial_: true

# Optimize the full image-resolution Poisson count tensor. There is no
# observation-derived candidate restriction or data-derived warm-start.

# Temperature and finite recurrence window for the DSGD count relaxation used
# while locating the mode. Importance samples are exact integer counts.
discrete_temperature: 0.1
dsgd_kwargs:
  # Upper bound on the anchor's binary search over counts. It truncates
  # silently once the rate passes roughly max_count + width: a Poisson rate of
  # 30 reads as 24.6 here, and 64 as 25.0. Safe at 16 because the per-site rate
  # this model reaches is about 1 -- the first pod run put 10 spikes in the
  # whole image with no site above 1.0.
  max_count: 16
  # 32 -> 8, for the recurrence window's cost, not for correctness.
  #
  # The window used to have to be tiny to dodge a NaN, but the NaN was never
  # about the window: `_gamma_count_log_pmf` takes the logarithm of an
  # incomplete-gamma tail that has underflowed to zero, and although the value
  # it returns is right, the derivative is NaN. The proposal phase then hands
  # `eval_and_stable_update` a NaN gradient, every update is discarded, and the
  # only visible symptom is a loss history of NaN. Fixed upstream in numpyro
  # commit 4ca6f62, which floors the four incomplete-gamma tails at finfo.tiny
  # inside `GammaCount.log_prob`; we carried a local shim until 2026-09-09.
  #
  # What actually drove it was the *fitted* GammaCount concentration, not the
  # rate and not the width. It starts at one and the proposal objective pushes
  # it up, because an underdispersed count proposal is what reduces
  # importance-weight variance. Whether the gradient was finite at rate 1e-3:
  #
  #   concentration  1.00  1.65  2.72  4.48
  #   W = 2          yes   yes   yes   NaN
  #   W = 4          yes   yes   NaN   NaN
  #   W = 8          yes   NaN   NaN   NaN
  #
  # So no width survived a concentration the fitter was always going to reach,
  # and the earlier `width: 4` only postponed the failure past a short smoke
  # run. With the repair in place every combination up to concentration 500 and
  # W = 32 is finite.
  #
  # 8 rather than 32 because the window is materialized per site: 230,400 sites
  # times 2W terms is 14.7M floats per particle at W = 32 against 3.7M at W = 8,
  # and the relaxed mean is identical for every rate up to 4.
  width: 8

# Fit a factorized proposal around the relaxed joint MAP, then draw exact
# particles from that proposal and self-normalize their importance weights.
init_dispersion: 0.1

# Start the relaxed count field at its own prior mean rather than at
# AutoMAPProposal's support-aware default. The default draws exp(U(-2, 2)) per
# coordinate -- 417,081 glyph stamps for an 80x80 image -- which drives the
# optical depth to 7.1e4 per pixel. There A = 1 exactly and dA/dtau = exp(-tau)
# is exactly zero in float32, so the likelihood gradient on all 230,400 count
# coordinates vanishes and only the Poisson prior pushes. See
# init_to_count_mean for the arithmetic that identified this.
init_loc_fn:
  _target_: src.inference.map_proposal_online.init_to_count_mean
  _partial_: true

# The MAP phase moves the count field in LOG space, and Adam moves at most one
# step size per step. From the prior mean at log(4/230400) = -10.96, raising the
# handful of true sites to a count near one is a journey of about 11, so it
# needs at least 11/step_size steps: 1,100 at the former 0.01. The former 200
# steps could travel 2.0 and were never going to arrive. 0.05 x 1500 gives 75
# of travel, with plenty of margin for the line the optimizer actually walks.
# Return the iterate that reached the lowest loss, not the last one. The MAP
# trajectory does not reliably end at its own minimum: Adam's update is
# lr * m / (sqrt(v) + eps), so as the gradient decays near an optimum v decays
# with it and the normalised step can grow rather than shrink. Measured on the
# five rotated images at a fixed 1500-step budget, the last iterate gives back
#
#   image      plain Poisson   zero-inflated
#   0000_LJ        103.9           1421.4
#   0001_JA         23.4             13.2
#   0002_QS          0.0             21.4
#   0003_7Z          5.6              0.3
#   0004_7D         12.3              6.8
#
# nats against the best it reached. On 0000_LJ under the stiffer prior that is
# the difference between a glyph evidence of +160.8 and +1582.2. It also makes
# `map_values` -- the source of every peak, truth_rank and coefficient count we
# read -- correspond to the point the fit actually reached.
#
# Needs numpyro f3de9887 or later. Applies to the MAP phase only: that
# objective is deterministic given the latents, so its per-step minimum is a
# real point, whereas the proposal objective resamples particles every step and
# taking its minimum would chase Monte Carlo noise.
map_keep_best: true

map_max_steps: 1500
map_optimizer:
  _target_: numpyro.optim.Adam
  step_size: 0.05
map_tolerance: 1.0e-5
num_dispersion_particles: 8
num_importance_samples: 64

# The dispersion phase starts each count rate at the MAP value, so it has no
# comparable distance to travel and keeps the smaller step. Its objective is
# stochastic, so a smaller step is also the right call.
proposal_max_steps: 500
proposal_optimizer:
  _target_: numpyro.optim.Adam
  step_size: 0.01
proposal_tolerance: 1.0e-3

# EARLY STOPPING IS DELIBERATELY DISABLED: 2000 exceeds `map_max_steps`, so
# the optimizer takes the whole budget in one `lax.scan` chunk, the stall test
# never runs a second interval, and `map_converged` is False by construction
# and carries no information. Read the step count instead -- it is now always
# the cap. This covers the dispersion phase too, whose 500 steps were already
# running to the cap with `converged=False` in every run on record, so nothing
# changes there.
#
# WHY. At 1.0e-5 the tolerance is *relative*, and this loss has magnitude
# ~39,000, so the rule was "stop when twenty steps gain under 0.4 nats"; with
# a patience of 5 that is a 100-step plateau. On a trajectory with hundreds of
# nats still to give, that fires on noise. Measured on `0000_LJ`, four runs
# that each reported `converged=True`:
#
#   run                                   steps   log joint   coefficients
#   plain Poisson, script                   540     39407.7           1127
#   zero-inflated, notebook, fresh kernel   340     39212.7           1363
#   zero-inflated, notebook, earlier        580     39372.1           1384
#   zero-inflated, script                   640     39009.8           1000
#
# The two zero-inflated runs stop at 580 and 640 steps and land 362 nats
# apart, the LONGER one scoring worse -- impossible along one trajectory, so
# the trajectories diverge (GPU reductions are not deterministic) and early
# stopping then samples them at an arbitrary point. The resulting spread,
# +-362 nats and +-380 coefficients on one configuration, is larger than every
# model effect measured from single runs in section 26, which is how a
# zero-inflation comparison came to be over-read on 2026-09-10.
#
# COST: nothing measurable. Runtime is flat in step count because compilation
# dominates -- `0003_7Z` ran 1440 steps in 183 s while `0000_LJ` ran 540 in
# 218 s -- and one 1500-step scan compiles the same as a 20-step one while
# saving 74 round-trips to Python.
#
# To restore early stopping, set this below `map_max_steps` again; 20 was the
# previous value. Do that only with a tolerance chosen against the loss's
# actual magnitude, not against 1.
termination_check_interval: 2000
termination_patience: 5
