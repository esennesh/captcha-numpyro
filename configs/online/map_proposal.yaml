_target_: src.inference.map_proposal_online.MAPProposalCaptchaInference
_partial_: true

# Retain every dictionary template at four spatial hypotheses. This is an
# inference restriction only; Poisson sites at omitted locations are zero.
min_distance: 6.0
num_locations: 4

# Temperature and finite recurrence window for the DSGD count relaxation used
# while locating the mode. Importance samples are exact integer counts.
discrete_temperature: 0.1
dsgd_kwargs:
  max_count: 16
  width: 32

# Fit a factorized proposal around the relaxed joint MAP, then draw exact
# particles from that proposal and self-normalize their importance weights.
init_dispersion: 0.1
initial_count_mass: null
map_max_steps: 200
map_optimizer:
  _target_: numpyro.optim.Adam
  step_size: 0.01
map_tolerance: 1.0e-5
num_dispersion_particles: 8
num_importance_samples: 64
proposal_max_steps: 200
proposal_optimizer:
  _target_: numpyro.optim.Adam
  step_size: 0.01
proposal_tolerance: 1.0e-3
termination_check_interval: 20
termination_patience: 5
