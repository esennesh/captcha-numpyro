_target_: src.inference.qem_online.QEMCaptchaInference
_partial_: true

# Three class alternatives at four spatial hypotheses. This is an inference
# restriction only; the omitted Poisson sites are fixed to zero.
classes_per_location: 3
min_distance: 6.0
num_candidates: 12

# Proposal initialization only: put most expected count on the top alpha-mask
# class at each location while reserving mass for the retained alternatives.
# null count mass reuses placements.expected_count. The model prior is unchanged.
initial_alternative_fraction: 0.2
initial_count_mass: null

# K alternatives are drawn independently for each of the four latent sites.
# Their Cartesian combination therefore has K^4 terms before contraction.
num_samples: 4
num_steps: 20
num_posterior_samples: 8

# lambda_t = 1 - t^(-schedule_power) is the retained EMA fraction.
forget: null
schedule_power: 1.0

# Serial contraction limits intermediate memory without changing the estimator.
serial_sites:
  - candidate_counts
  - color
  - color_texture
  - warp_velocity
